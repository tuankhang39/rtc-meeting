<!doctype html>
<html lang="vi" data-theme="pink">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Họp video 2–3 người. Học không giới hạn, làm bạn Tiếng Trung — Cuộc hợp của Xiao xin Laoshi"
    />
    <title>Cuộc hợp của Xiao xin Laoshi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('xiaoxin-theme')
        if (t === 'dark' || t === 'pink') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
